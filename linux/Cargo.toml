[package]
name = "windowsnap"
version = "0.1.0"
edition = "2021"
description = "应用快照 Linux 版：快捷键截取当前活动窗口并复制到剪贴板"
license = "MIT"

[dependencies]
# 全部为纯 Rust 实现，无 C 库依赖，可在任意架构上直接 cargo build / 交叉编译
png = "0.17"
x11rb = { version = "0.13", features = ["shape"] }
zbus = "5"
wl-clipboard-rs = "0.9"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
serde_json = "1"
chrono = "0.4"
gif = "0.14"

[profile.release]
strip = true
lto = true
