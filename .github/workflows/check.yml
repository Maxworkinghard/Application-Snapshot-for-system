# 每次 push / PR 都在三端各跑一次编译检查。
#
# 存在的理由：adapter 用 #[cfg(target_os)] 分platform，某一端的代码在别的平台上
# 根本不参与编译。历史上因此连续漏过两次编译阻断——一次是合并分支时漏放宽
# rgba_to_data_url 的 cfg，一次是重构时删掉了 scrolling.rs 仍在 import 的函数。
# 两次都是「写代码的机器编不到那一端」，只能靠 CI 兜。
#
# 这里只做 check + test，不打包：打包留给 release.yml，日常不需要等那么久。
name: Check

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # tsc + vite build，前端类型错误在这里就拦住
      - run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux
          - runner: windows-latest
            name: windows
          - runner: macos-latest
            name: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 直接用仓库里给 Linux 用户的那份依赖脚本，顺带保证它在干净机器上是有效的
      - name: System deps
        if: matrix.name == 'linux'
        run: bash scripts/linux/install-deps.sh
      # tauri-build 会校验 externalBin 声明的 sidecar 是否存在，macOS 上要先备好
      - name: Prepare sidecar
        if: matrix.name == 'macos'
        run: bash scripts/build-ocr-sidecar.sh
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
