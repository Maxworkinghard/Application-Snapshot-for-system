name: Apply linux parity patches
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: adapt/linux-parity
          fetch-depth: 0
      - name: Apply patches
        run: |
          set -euo pipefail
          : > /tmp/lib.rs.patch
          decode_part() {
            local stem="$1"
            if [ -f "patches/linux-parity/${stem}a.b64" ]; then
              cat "patches/linux-parity/${stem}a.b64" "patches/linux-parity/${stem}b.b64" | tr -d '\n' | base64 -d >> /tmp/lib.rs.patch
            else
              base64 -d "patches/linux-parity/${stem}.b64" >> /tmp/lib.rs.patch
            fi
          }
          for i in 00 01 02 03 04 05 06; do
            decode_part "lib.rs.s${i}"
          done
          git apply --verbose patches/linux-parity/styles.css.patch
          git apply --verbose patches/linux-parity/App.tsx.patch
          git apply --verbose patches/linux-parity/Cargo.lock.patch
          git apply --verbose /tmp/lib.rs.patch
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/App.tsx src-tauri/Cargo.lock src-tauri/src/lib.rs
          git status
          git commit -m "feat: apply remaining linux parity sources (styles, App, lib, Cargo.lock)"
          git push origin HEAD:adapt/linux-parity
