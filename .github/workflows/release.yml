# 推送 v* tag（或手工 workflow_dispatch）后，用 Tauri 为 macOS / Windows / Linux 三端打附件，
# 合成 SHA256SUMS.txt，并创建 **draft + pre-release**。不会直接公开。
# 人工检查附件与说明后再在 GitHub 上点 Publish。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$'; then
            echo "error: version '$VERSION' is not like 0.1.0" >&2
            exit 1
          fi
          # 附件名取自 tag，但包内版本号来自 tauri.conf.json，两边不一致会发出对不上号的包
          CONF_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          FILE_VERSION="$(tr -d ' \n\r' < VERSION)"
          if [ "$CONF_VERSION" != "$VERSION" ] || [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "error: tag $VERSION != tauri.conf.json $CONF_VERSION != VERSION $FILE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      # beforeBuildCommand 会顺带把 OCR 与 ScreenCaptureKit 录制桥编成 universal sidecar
      - name: Build universal app bundle
        run: npm run tauri build -- --target universal-apple-darwin --bundles app
      - name: Verify slices and pack zip
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/snapshot.app"
          test -d "$APP" || { echo "error: missing $APP" >&2; exit 1; }
          # 主程序和两个 sidecar 都必须是双切片，少一个就不是 universal 包
          for bin in "$APP/Contents/MacOS/snapshot" "$APP/Contents/MacOS/snapshot-ocr" "$APP/Contents/MacOS/snapshot-recorder"; do
            ARCHS="$(lipo -archs "$bin")"
            echo "$bin: $ARCHS"
            case "$ARCHS" in *arm64*) ;; *) echo "error: $bin 缺 arm64 切片" >&2; exit 1 ;; esac
            case "$ARCHS" in *x86_64*) ;; *) echo "error: $bin 缺 x86_64 切片" >&2; exit 1 ;; esac
          done
          mkdir -p dist/release
          ditto -c -k --keepParent "$APP" "dist/release/Application-Snapshot-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/Application-Snapshot-*-macos-universal.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - run: npm ci
      - name: Build x64 installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Build ARM64 installer
        run: npm run tauri build -- --target aarch64-pc-windows-msvc --bundles nsis
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          for pair in "x86_64-pc-windows-msvc x64" "aarch64-pc-windows-msvc arm64"; do
            set -- $pair
            SRC="src-tauri/target/$1/release/bundle/nsis/snapshot_${VERSION}_$2-setup.exe"
            test -f "$SRC" || { echo "error: missing $SRC" >&2; ls -la "src-tauri/target/$1/release/bundle/nsis" || true; exit 1; }
            cp "$SRC" "dist/release/Application-Snapshot-${VERSION}-windows-$2.exe"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/release/Application-Snapshot-*-windows-x64.exe
            dist/release/Application-Snapshot-*-windows-arm64.exe
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个架构都用原生 runner：Linux 侧要链 webkit2gtk 等一堆 C 库，交叉编译得整套 sysroot
          - runner: ubuntu-24.04
            arch: x86_64
            deb_arch: amd64
            appimage_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
            deb_arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # 直接用仓库里给 Linux 用户的那份依赖脚本，顺带保证它在干净机器上是有效的
      - name: System deps
        run: bash scripts/linux/install-deps.sh
      - run: npm ci
      - name: Build deb and AppImage
        run: npm run tauri build -- --bundles deb,appimage
      - name: Collect packages
        run: |
          set -euo pipefail
          mkdir -p dist/release
          DEB="src-tauri/target/release/bundle/deb/snapshot_${VERSION}_${{ matrix.deb_arch }}.deb"
          APPIMAGE="src-tauri/target/release/bundle/appimage/snapshot_${VERSION}_${{ matrix.appimage_arch }}.AppImage"
          for f in "$DEB" "$APPIMAGE"; do
            test -f "$f" || { echo "error: missing $f" >&2; find src-tauri/target/release/bundle -maxdepth 2 -type f | head -20; exit 1; }
          done
          cp "$DEB" "dist/release/Application-Snapshot-${VERSION}-linux-${{ matrix.arch }}.deb"
          cp "$APPIMAGE" "dist/release/Application-Snapshot-${VERSION}-linux-${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/release/Application-Snapshot-*-linux-${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Verify set and checksums
        working-directory: dist/release
        run: |
          set -euo pipefail
          expected=(
            "Application-Snapshot-${VERSION}-macos-universal.zip"
            "Application-Snapshot-${VERSION}-windows-x64.exe"
            "Application-Snapshot-${VERSION}-windows-arm64.exe"
            "Application-Snapshot-${VERSION}-linux-x86_64.deb"
            "Application-Snapshot-${VERSION}-linux-x86_64.AppImage"
            "Application-Snapshot-${VERSION}-linux-aarch64.deb"
            "Application-Snapshot-${VERSION}-linux-aarch64.AppImage"
          )
          for f in "${expected[@]}"; do
            test -f "$f" || { echo "missing $f" >&2; ls -la; exit 1; }
          done
          sha256sum "${expected[@]}" | tee SHA256SUMS.txt
      - name: Render notes
        run: |
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > /tmp/release-notes.md
      - name: Create draft pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            dist/release/Application-Snapshot-${VERSION}-macos-universal.zip
            dist/release/Application-Snapshot-${VERSION}-windows-x64.exe
            dist/release/Application-Snapshot-${VERSION}-windows-arm64.exe
            dist/release/Application-Snapshot-${VERSION}-linux-x86_64.deb
            dist/release/Application-Snapshot-${VERSION}-linux-x86_64.AppImage
            dist/release/Application-Snapshot-${VERSION}-linux-aarch64.deb
            dist/release/Application-Snapshot-${VERSION}-linux-aarch64.AppImage
            dist/release/SHA256SUMS.txt
          )
          gh release create "$TAG" "${assets[@]}" \
            --draft \
            --prerelease \
            --title "应用快照 ${VERSION}" \
            --notes-file /tmp/release-notes.md
